services:
  - type: web
    name: docbot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set manually in Render dashboard — never commit the value
      - key: TOP_K_CHUNKS
        value: "5"
      - key: PYTHON_VERSION
        value: "3.11.0"
